    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 全局状态 ---
        const PARTICLE_COUNT = 200000;
        const STATE = {
            files: [], 
            currentIndex: -1, 
            isMorphing: false, 
            morphProgress: 0, 
            isSolidMode: false, 
            solidMorphProgress: 0, 
            currentSolidMesh: null,
            targetRotationY: 0, currentRotationY: 0, 
            targetRotationX: 0, currentRotationX: 0,
            targetScale: 1.0, currentScale: 1.0, 
            actionProgress: 0, 
            isCooldown: false,
            lastFrameTime: performance.now(),
            isPanelFolded: false,
            // 鼠标/触摸增量控制
            mouse: {
                isDragging: false,
                previousX: 0,
                previousY: 0,
                targetX: 0,
                targetY: 0,
                currentX: 0,
                currentY: 0,
                // 长按切换属性
                longPressTimer: null,
                isLongPressCanceled: false,
                startX: 0,
                startY: 0
            }
        };

        const KNOWLEDGE_BASE = {
            "兽面纹": "兽面纹瓦当的数量在高句丽时期仅次于莲花纹瓦当。兽面纹瓦当多是与中原文化中的兽纹与饕餮纹演化而来的。高句丽受其影响注入了东北地区东北虎的形象。从而形成了高句丽人典型的兽面纹饰题材。<br><br>兽面纹的形成也是一种对强者的崇拜，寓意着强大，力量，牢固与邪祟不得靠近的庄严形象。"
        };

        window.toggleUploadPanel = function() {
            const panel = document.getElementById('upload-panel');
            const body = document.getElementById('panel-body');
            const headerText = document.getElementById('header-content');
            const foldSvg = document.getElementById('fold-svg');
            STATE.isPanelFolded = !STATE.isPanelFolded;
            if (STATE.isPanelFolded) {
                panel.style.width = '52px'; panel.style.height = '52px'; panel.style.borderRadius = '26px';
                body.style.opacity = '0'; headerText.style.opacity = '0';
                foldSvg.style.transform = 'rotate(-135deg) scale(1.2)'; foldSvg.style.color = '#FFD700';
                setTimeout(() => { if(STATE.isPanelFolded) body.style.display = 'none'; }, 300);
            } else {
                panel.style.width = '320px'; panel.style.height = 'auto'; panel.style.borderRadius = '12px';
                body.style.display = 'flex';
                setTimeout(() => { body.style.opacity = '1'; headerText.style.opacity = '1'; }, 10);
                foldSvg.style.transform = 'rotate(0deg)'; foldSvg.style.color = '';
            }
        };

        // --- 初始化渲染 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000);
        container.appendChild(renderer.domElement);

        // --- 光影增强方案 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.75)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4); 
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(-5, 3, 2);
        scene.add(pointLight);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.0; bloomPass.strength = 0.8; bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- 鼠标/触摸/捏合/长按事件注册 ---
        const initDragAndZoomControls = () => {
            let initialPinchDistance = 0;
            let initialScale = STATE.targetScale;
            let lastTapTime = 0; // 记录移动端触屏上一次点击时间，用于判定双击

            // 长按核心逻辑处理函数：按下开始计时
            const startLongPressTimer = (clientX, clientY) => {
                STATE.mouse.startX = clientX;
                STATE.mouse.startY = clientY;
                STATE.mouse.isLongPressCanceled = false;
                
                clearTimeout(STATE.mouse.longPressTimer);
                STATE.mouse.longPressTimer = setTimeout(() => {
                    // 如果中途未被滑动或双指操作取消，并且模型队列大于1，非变形过程中，触发模型切换
                    if (!STATE.mouse.isLongPressCanceled && STATE.files.length > 1 && !STATE.isMorphing) {
                        const nextIndex = (STATE.currentIndex + 1) % STATE.files.length;
                        switchModelTo(nextIndex);
                        // 移动端震动反馈（如果硬件支持）
                        if (navigator.vibrate) {
                            navigator.vibrate(50);
                        }
                    }
                }, 800); // 800ms 触发长按
            };

            // 滑动过大自动取消长按判定
            const checkCancelLongPress = (clientX, clientY) => {
                const dist = Math.hypot(clientX - STATE.mouse.startX, clientY - STATE.mouse.startY);
                if (dist > 10) { // 移动位移大于10像素则取消长按，判定为旋转手势
                    STATE.mouse.isLongPressCanceled = true;
                    clearTimeout(STATE.mouse.longPressTimer);
                }
            };

            const cancelLongPress = () => {
                STATE.mouse.isLongPressCanceled = true;
                clearTimeout(STATE.mouse.longPressTimer);
            };

            const onPointerDown = (clientX, clientY) => {
                STATE.mouse.isDragging = true;
                STATE.mouse.previousX = clientX;
                STATE.mouse.previousY = clientY;
                startLongPressTimer(clientX, clientY);
            };

            const onPointerMove = (clientX, clientY) => {
                checkCancelLongPress(clientX, clientY);
                if (!STATE.mouse.isDragging) return;
                
                const deltaX = clientX - STATE.mouse.previousX;
                const deltaY = clientY - STATE.mouse.previousY;

                // 旋转敏感度阻尼
                STATE.mouse.targetY += deltaX * 0.006;
                STATE.mouse.targetX += deltaY * 0.006;

                // 限制X轴旋转范围，防止模型翻转过度
                STATE.mouse.targetX = Math.max(-Math.PI * 0.4, Math.min(Math.PI * 0.4, STATE.mouse.targetX));

                STATE.mouse.previousX = clientX;
                STATE.mouse.previousY = clientY;
            };

            const onPointerUp = () => {
                STATE.mouse.isDragging = false;
                cancelLongPress();
            };

            // 鼠标拖拽 & 长按切换
            container.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onPointerUp);

            // PC 端快速双击，切换虚实混合模式
            container.addEventListener('dblclick', (e) => {
                e.preventDefault();
                STATE.isSolidMode = !STATE.isSolidMode;
            });

            // 鼠标滚轮缩放 (带有阈值限制，防止过大过小)
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.0012;
                STATE.targetScale -= e.deltaY * zoomSpeed;
                STATE.targetScale = Math.max(0.4, Math.min(STATE.targetScale, 3.0));
            }, { passive: false });

            // 触摸事件适配移动端（支持单指拖拽旋转、双指捏合缩放、双击虚实切换、单指长按切换模型）
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const now = performance.now();
                    const deltaTap = now - lastTapTime;
                    
                    // 双击逻辑判定（间隔小于 300 毫秒视为双击切换虚实）
                    if (deltaTap < 300 && deltaTap > 0) {
                        STATE.isSolidMode = !STATE.isSolidMode;
                        lastTapTime = 0; // 重置
                        cancelLongPress(); // 双击不触发长按
                    } else {
                        lastTapTime = now;
                        onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
                    }
                    initialPinchDistance = 0; // 重置捏合起点
                } else if (e.touches.length === 2) {
                    // 进入双指缩放模式
                    STATE.mouse.isDragging = false; // 终止单指拖拽，避免抖动旋转
                    cancelLongPress(); // 双指操作立即取消长按
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.hypot(dx, dy);
                    initialScale = STATE.targetScale;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2 && initialPinchDistance > 0) {
                    // 双指捏合放大缩小逻辑
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currentDistance = Math.hypot(dx, dy);
                    const factor = currentDistance / initialPinchDistance;
                    STATE.targetScale = Math.max(0.4, Math.min(initialScale * factor, 3.0));
                }
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = 0;
                }
                onPointerUp();
            });
        };
        initDragAndZoomControls();

        // --- 粒子系统设置与重构 ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const targetNormals = new Float32Array(PARTICLE_COUNT * 3); // 法线属性数组来记录模型各点朝向
        const randoms = new Float32Array(PARTICLE_COUNT);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = 3 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
            targetPositions[i * 3] = positions[i * 3];
            targetPositions[i * 3 + 1] = positions[i * 3 + 1];
            targetPositions[i * 3 + 2] = positions[i * 3 + 2];
            targetNormals[i * 3] = 0;
            targetNormals[i * 3 + 1] = 1;
            targetNormals[i * 3 + 2] = 0;
            randoms[i] = Math.random();
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
        geometry.setAttribute('targetNormal', new THREE.BufferAttribute(targetNormals, 3)); // 注册法线属性
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorphProgress: { value: 0 },
                uSolidProgress: { value: 0 },
                uColorTop: { value: new THREE.Color('#FFF5E1') },
                uColorMid: { value: new THREE.Color('#FFD700') },
                uColorBottom: { value: new THREE.Color('#FF9E3D') }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uMorphProgress;
                uniform float uSolidProgress;
                attribute vec3 targetPosition;
                attribute vec3 targetNormal;
                attribute float aRandom;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vShading;
                uniform vec3 uColorTop;
                uniform vec3 uColorMid;
                uniform vec3 uColorBottom;

                void main() {
                    vec3 chaosPos = position;
                    // 混沌状态下的粒子扰动
                    chaosPos.x += sin(uTime * 0.5 + aRandom * 10.0) * 0.2;
                    chaosPos.y += cos(uTime * 0.6 + aRandom * 10.0) * 0.2;
                    chaosPos.z += sin(uTime * 0.4 + aRandom * 10.0) * 0.2;
                    
                    float easeProgress = smoothstep(0.0, 1.0, uMorphProgress);
                    vec3 morphedPos = mix(chaosPos, targetPosition, easeProgress);

                    // 引入流体呼吸波动效果（沿着法线做细微的波浪扰动，保证瓦当起伏细节极其灵动）
                    float wave = sin(uTime * 1.8 + morphedPos.y * 3.5 + aRandom * 6.28) * 0.025 * easeProgress * (1.0 - uSolidProgress);
                    vec3 finalPos = morphedPos + targetNormal * wave;
                    vPos = finalPos;

                    // 三维光影计算：模拟右上侧展厅光源照射到瓦当低浮雕表面的漫反射与镜面反射
                    vec3 lightDir = normalize(vec3(0.5, 0.5, 1.0));
                    float diff = max(dot(targetNormal, lightDir), 0.0);
                    
                    // 镜面高光，突显瓦当雕刻的锐利边缘
                    vec3 viewDir = vec3(0.0, 0.0, 1.0);
                    vec3 halfDir = normalize(lightDir + viewDir);
                    float spec = pow(max(dot(targetNormal, halfDir), 0.0), 8.0) * 0.4;
                    
                    float ambient = 0.25;
                    float shading = ambient + diff * 0.75 + spec;
                    vShading = mix(1.0, shading, easeProgress);

                    // 空间高度插值配色
                    float mixVal = smoothstep(-2.0, 2.0, finalPos.y);
                    if (mixVal > 0.4) {
                        vColor = mix(uColorMid, uColorTop, smoothstep(0.4, 1.2, mixVal));
                    } else {
                        vColor = mix(uColorBottom, uColorMid, smoothstep(0.0, 0.4, mixVal));
                    }

                    vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                    
                    // 粒子尺寸自适应阴影：背光处的粒子自动缩小形成微观阴影效果，受光处稍微变大，极大地强化低浮雕细节！
                    float sizeShadingFactor = mix(0.4, 1.25, diff);
                    float pointSizeBase = 4.0;
                    gl_PointSize = (pointSizeBase * (0.8 + aRandom * 0.4) * sizeShadingFactor) / -mvPosition.z;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float uMorphProgress;
                uniform float uSolidProgress;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vShading;

                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float dist = length(xy);
                    if(dist > 0.5) discard;
                    
                    // 高精密带亮核的平滑星光粒子
                    float particleAlpha = smoothstep(0.5, 0.05, dist);
                    
                    float scanLine = mix(4.5, -4.5, uSolidProgress);
                    float solidAlphaFactor = 1.0 - smoothstep(scanLine - 0.3, scanLine + 0.3, vPos.y);
                    if (solidAlphaFactor <= 0.0) discard;
                    
                    float intensity = mix(1.8, 1.15, smoothstep(0.3, 1.0, uMorphProgress));
                    
                    // 结合顶点着色器传过来的法线光影强度渲染粒子，实现细腻的三维浮雕质感
                    gl_FragColor = vec4(vColor * intensity * vShading, particleAlpha * solidAlphaFactor); 
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(geometry, shaderMaterial);
        mainGroup.add(particleSystem);

        // --- 实体材质优化 ---
        function createWadangTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5a5248'; 
            ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 350000; i++) {
                const x = Math.random() * 1024; const y = Math.random() * 1024;
                ctx.fillStyle = Math.random() > 0.85 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.15)';
                ctx.fillRect(x, y, 2, 2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const solidMaterial = new THREE.MeshStandardMaterial({
            map: createWadangTexture(), 
            roughness: 0.7, 
            metalness: 0.2, 
            color: 0xD2C4B1, 
            transparent: true,
            side: THREE.DoubleSide
        });

        solidMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uSolidProgress = { value: 0 };
            shader.vertexShader = `varying vec3 vLocalPos;\n${shader.vertexShader}`.replace(`#include <begin_vertex>`, `#include <begin_vertex>\nvLocalPos = transformed;`);
            shader.fragmentShader = `uniform float uSolidProgress; varying vec3 vLocalPos;\n${shader.fragmentShader}`.replace(
                `#include <clipping_planes_fragment>`,
                `#include <clipping_planes_fragment>
                float scanLine = mix(4.5, -4.5, uSolidProgress);
                float solidAlpha = smoothstep(scanLine - 0.3, scanLine + 0.3, vLocalPos.y);
                if (solidAlpha <= 0.0) discard;
                gl_FragColor.a *= solidAlpha;
                float edge = abs(vLocalPos.y - scanLine);
                if (edge < 0.25) {
                    gl_FragColor.rgb += vec3(0.95, 0.8, 0.2) * (1.0 - edge/0.25) * 1.6;
                }
                `
            );
            solidMaterial.userData.shader = shader;
        };

        // --- 模型逻辑 ---
        const objLoader = new OBJLoader();
        function parseAndSampleOBJ(objText, callback) {
            try {
                const group = objLoader.parse(objText);
                const geometries = [];
                group.traverse((child) => {
                    if (child.isMesh) {
                        let geom = child.geometry.clone();
                        geom.center();
                        // 初始缩放比例由 2.8 调整为 1.6，使模型加载初始占屏幕比例更小、更精致
                        const scale = 1.6 / (geom.boundingSphere || (geom.computeBoundingSphere(), geom.boundingSphere)).radius;
                        geom.scale(scale, scale, scale);
                        geometries.push(geom);
                    }
                });
                if (geometries.length === 0) return callback(false);
                const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
                const sampler = new MeshSurfaceSampler(new THREE.Mesh(mergedGeometry)).build();
                const targetPosArray = geometry.attributes.targetPosition.array;
                const targetNormalArray = geometry.attributes.targetNormal.array; // 获取粒子法线属性映射
                const tempPos = new THREE.Vector3();
                const tempNormal = new THREE.Vector3(); // 临时存储法线数据

                let currentIdx = 0;
                const batchSize = 15000;
                function processBatch() {
                    const limit = Math.min(currentIdx + batchSize, PARTICLE_COUNT);
                    for (; currentIdx < limit; currentIdx++) {
                        sampler.sample(tempPos, tempNormal); // 同时高精密采样点的位置与法线方向
                        targetPosArray[currentIdx * 3] = tempPos.x;
                        targetPosArray[currentIdx * 3 + 1] = tempPos.y;
                        targetPosArray[currentIdx * 3 + 2] = tempPos.z;
                        targetNormalArray[currentIdx * 3] = tempNormal.x; // 保存法线到GPU缓冲
                        targetNormalArray[currentIdx * 3 + 1] = tempNormal.y;
                        targetNormalArray[currentIdx * 3 + 2] = tempNormal.z;
                    }
                    if (currentIdx < PARTICLE_COUNT) { requestAnimationFrame(processBatch); } else {
                        geometry.attributes.targetPosition.needsUpdate = true;
                        geometry.attributes.targetNormal.needsUpdate = true; // 刷新GPU渲染管线法线缓冲
                        if (STATE.currentSolidMesh) mainGroup.remove(STATE.currentSolidMesh);
                        mergedGeometry.computeVertexNormals();
                        STATE.currentSolidMesh = new THREE.Mesh(mergedGeometry, solidMaterial);
                        mainGroup.add(STATE.currentSolidMesh);
                        callback(true);
                    }
                }
                processBatch();
            } catch (err) { callback(false); }
        }

        const fileUpload = document.getElementById('file-upload');
        fileUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) { STATE.files.push(...files); updateFileListUI(); if (STATE.currentIndex === -1) switchModelTo(0); }
        });

        // 更新上传模型队列列表UI
        function updateFileListUI() {
            document.getElementById('file-count').innerText = `(${STATE.files.length})`;
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            STATE.files.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `px-3 py-2 rounded truncate transition-all duration-300 ${index === STATE.currentIndex ? 'bg-gold/20 text-white border border-gold/30' : 'text-gray-400 border border-transparent'}`;
                li.innerText = file.name; list.appendChild(li);
            });
        }

        // 切换加载3D OBJ文物模型
        async function switchModelTo(index) {
            if (STATE.isMorphing) return;
            STATE.currentIndex = index; updateFileListUI();
            STATE.isSolidMode = false; STATE.solidMorphProgress = 0;
            STATE.isMorphing = true;
            await animateMorph(STATE.morphProgress, 0, 300);

            const text = await STATE.files[index].text();
            parseAndSampleOBJ(text, async (success) => {
                if (success) {
                    await animateMorph(0, 1, 1000);
                    showAICard(STATE.files[index].name);
                } else {
                    STATE.isMorphing = false;
                }
            });
        }

        // 属性变动过渡效果核心逻辑
        function animateMorph(from, to, duration) {
            return new Promise((resolve) => {
                const startTime = performance.now();
                function update() {
                    const elapsed = performance.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    STATE.morphProgress = from + (to - from) * progress;
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else {
                        STATE.isMorphing = false;
                        resolve();
                    }
                }
                requestAnimationFrame(update);
            });
        }

        // 展示AI文物知识库
        function showAICard(filename) {
            const aiPanel = document.getElementById('ai-panel');
            const aiTitle = document.getElementById('ai-title');
            const aiText = document.getElementById('ai-text');
            const cleanName = filename.replace(/\.[^/.]+$/, "");
            aiTitle.innerText = cleanName;
            aiText.innerHTML = KNOWLEDGE_BASE[cleanName] || "解析出独特的纹样数据：这是高句丽古风时期艺术品的珍贵遗留。精妙的线条起伏生动展示了当时的工匠技艺，蕴含着浓郁的地方特色与文化价值。";
            aiPanel.style.opacity = '1';
            aiPanel.style.transform = 'translateX(0)';
        }

        // --- 手势识别设置 ---
        let mediaPipeHands = null;
        let cameraUtilsInstance = null;
        const startCamOverlay = document.getElementById('start-cam-overlay');
        const progressRing = document.getElementById('progress-ring');
        const camStatus = document.getElementById('cam-status');
        const camStatusText = document.getElementById('cam-status-text');

        startCamOverlay.addEventListener('click', () => {
            startCamOverlay.classList.add('hidden');
            initHandTracking();
        });

        function setRingProgress(percentage) {
            const circumference = 2 * Math.PI * 45;
            const offset = circumference - (percentage / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        async function initHandTracking() {
            camStatus.className = 'w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse';
            camStatusText.innerText = '正在调起相机...';
            const videoElement = document.getElementById('video-input');
            const handsCanvas = document.getElementById('hands-canvas');
            const canvasCtx = handsCanvas.getContext('2d');

            mediaPipeHands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            mediaPipeHands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.75,
                minTrackingConfidence: 0.7
            });

            mediaPipeHands.onResults((results) => {
                if (handsCanvas.style.opacity === '0') handsCanvas.style.opacity = '1';
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, handsCanvas.width, handsCanvas.height);
                canvasCtx.drawImage(results.image, 0, 0, handsCanvas.width, handsCanvas.height);
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    camStatus.className = 'w-1.5 h-1.5 rounded-full bg-green-500';
                    camStatusText.innerText = '完美追踪中';
                    drawConnectors(canvasCtx, results.multiHandLandmarks[0], HAND_CONNECTIONS, {color: '#FFD700', lineWidth: 2});
                    drawLandmarks(canvasCtx, results.multiHandLandmarks[0], {color: '#FFFFFF', lineWidth: 1, radius: 2});
                    processGesture(results.multiHandLandmarks[0]);
                } else {
                    camStatus.className = 'w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse';
                    camStatusText.innerText = '未检测到手势';
                    setRingProgress(0);
                    STATE.actionProgress = 0;
                }
                canvasCtx.restore();
            });

            cameraUtilsInstance = new Camera(videoElement, {
                onFrame: async () => {
                    await mediaPipeHands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            cameraUtilsInstance.start().catch(() => {
                camStatus.className = 'w-1.5 h-1.5 rounded-full bg-red-600';
                camStatusText.innerText = '获取摄像头失败';
            });
        }

        // 识别手掌关键点动作
        function processGesture(landmarks) {
            if (STATE.isCooldown) return;

            const getDist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y, p1.z - p2.z);
            const isFingerExtended = (tip, pip, mcp) => tip.y < pip.y && pip.y < mcp.y;

            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            // 测算OK手势：食指捏紧大拇指，其余三指舒展张开
            const isOkGesture = getDist(thumbTip, indexTip) < 0.055 && 
                               isFingerExtended(middleTip, landmarks[10], landmarks[9]) &&
                               isFingerExtended(ringTip, landmarks[14], landmarks[13]) &&
                               isFingerExtended(pinkyTip, landmarks[18], landmarks[17]);

            // 测算握拳手势：所有手指闭合折叠
            const isFistGesture = middleTip.y > landmarks[9].y &&
                                 ringTip.y > landmarks[13].y &&
                                 pinkyTip.y > landmarks[17].y &&
                                 indexTip.y > landmarks[5].y;

            if (isOkGesture && STATE.files.length > 1 && !STATE.isMorphing) {
                STATE.actionProgress += 3.5; // 大约耗时1秒
                setRingProgress(Math.min(STATE.actionProgress, 100));
                if (STATE.actionProgress >= 100) {
                    triggerCooldown();
                    const nextIndex = (STATE.currentIndex + 1) % STATE.files.length;
                    switchModelTo(nextIndex);
                }
            } else if (isFistGesture && !STATE.isMorphing) {
                STATE.actionProgress += 4.5;
                setRingProgress(Math.min(STATE.actionProgress, 100));
                if (STATE.actionProgress >= 100) {
                    triggerCooldown();
                    STATE.isSolidMode = !STATE.isSolidMode;
                }
            } else {
                STATE.actionProgress = Math.max(0, STATE.actionProgress - 5);
                setRingProgress(STATE.actionProgress);
            }
        }

        // 设置冷却时间
        function triggerCooldown() {
            STATE.isCooldown = true; STATE.actionProgress = 0; setRingProgress(0);
            setTimeout(() => { STATE.isCooldown = false; }, 1200);
        }

        // --- 核心渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = (now - STATE.lastFrameTime) / 1000;
            STATE.lastFrameTime = now;

            shaderMaterial.uniforms.uTime.value = now * 0.001;

            // 顺滑旋转阻尼平滑过渡
            STATE.currentRotationY += (STATE.mouse.targetY - STATE.currentRotationY) * 0.08;
            STATE.currentRotationX += (STATE.mouse.targetX - STATE.currentRotationX) * 0.08;
            
            mainGroup.rotation.y = STATE.currentRotationY;
            mainGroup.rotation.x = STATE.currentRotationX;

            // 顺滑比例阻尼过渡
            STATE.currentScale += (STATE.targetScale - STATE.currentScale) * 0.1;
            mainGroup.scale.setScalar(STATE.currentScale);

            // 控制粒子和实体的平滑虚实扫描过渡动画
            const targetSolidProgress = STATE.isSolidMode ? 1 : 0;
            STATE.solidMorphProgress += (targetSolidProgress - STATE.solidMorphProgress) * 0.05;
            
            shaderMaterial.uniforms.uMorphProgress.value = STATE.morphProgress;
            shaderMaterial.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            
            if (solidMaterial.userData.shader) {
                solidMaterial.userData.shader.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            }

            composer.render();
        }

        // --- 自适应排版 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 默认模型初始化加载（由于这里不带有预置多媒体文件，所以由用户自行上传 OBJ 开始运行）
        updateFileListUI();
        animate();
    </script>
</body>
</html>
