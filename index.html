    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 全局状态 ---
        const PARTICLE_COUNT = 300000;
        const STATE = {
            files: [], 
            currentIndex: -1, 
            isMorphing: false, 
            morphProgress: 0, 
            isSolidMode: false, 
            solidMorphProgress: 0, 
            currentSolidMesh: null,
            targetRotationY: 0, currentRotationY: 0, 
            targetRotationX: 0, currentRotationX: 0,
            targetScale: 1.0, currentScale: 1.0, 
            actionProgress: 0, 
            isCooldown: false,
            lastFrameTime: performance.now(),
            isPanelFolded: false
        };

        const KNOWLEDGE_BASE = {
            "兽面纹": "兽面纹瓦当的数量在高句丽时期仅次于莲花纹瓦当。兽面纹瓦当多是与中原文化中的兽纹与饕餮纹演化而来的。高句丽受其影响注入了东北地区东北虎的形象。从而形成了高句丽人典型的兽面纹饰题材。<br><br>兽面纹的形成也是一种对强者的崇拜，寓意着强大，力量，牢固与邪祟不得靠近的庄严形象。",
            "莲花纹": "莲花纹瓦当是高句丽时期出土数量最多、分布最广的瓦当。佛教的传入对高句丽的文化艺术产生了深远影响，莲花出淤泥而不染的特质契合了当时的宗教信仰与审美。",
            "卷云纹": "卷云纹瓦当线条流畅，气韵生动，象征着天空、云彩以及高升的祥瑞之气，体现了古人对自然天象的敬畏与浪漫的艺术加工。",
            "忍冬纹": "忍冬纹瓦当图案源于忍冬植物，寓意延年益寿、长久不衰。这种纹饰随佛教传入，后经过本土化融合，成为极具时代特色的装饰图案。"
        };

        // --- 核心预存逻辑：懒加载伪装模型库 ---
        const PRELOAD_MODELS = [
            { name: "兽面纹瓦当.obj", path: "models/shoumian_wadang.obj" },
            { name: "莲花纹瓦当.obj", path: "models/lianhua_wadang.obj" },
            { name: "卷云纹瓦当.obj", path: "models/juanyun_wadang.obj" },
            { name: "忍冬纹瓦当.obj", path: "models/rendong_wadang.obj" }
        ];

        function initPreloadModels() {
            PRELOAD_MODELS.forEach(item => {
                STATE.files.push({
                    name: item.name,
                    // 【懒加载核心】只有在真正被选中（调用 .text()）时，才去网络请求 obj 数据
                    text: async () => {
                        try {
                            const response = await fetch(item.path);
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            return await response.text();
                        } catch (error) {
                            console.error(`无法加载预存模型 [${item.name}]，请确认 models 文件夹及其路径是否正确:`, error);
                            // 若加载失败，返回一个极简的立方体防止程序崩溃
                            return "v -1 -1 1\nv 1 -1 1\nv -1 1 1\nv 1 1 1\nv -1 -1 -1\nv 1 -1 -1\nv -1 1 -1\nv 1 1 -1\nf 1 2 4 3\nf 3 4 8 7\nf 7 8 6 5\nf 5 6 2 1\nf 3 7 5 1\nf 2 6 8 4";
                        }
                    }
                });
            });

            // 预存完成后，刷新右侧列表UI，并自动加载队列中第一个模型
            if (STATE.files.length > 0) {
                updateFileListUI();
                switchModelTo(0); 
            }
        }
        // ------------------------------------

        window.toggleUploadPanel = function() {
            const panel = document.getElementById('upload-panel');
            const body = document.getElementById('panel-body');
            const headerText = document.getElementById('header-content');
            const foldSvg = document.getElementById('fold-svg');
            STATE.isPanelFolded = !STATE.isPanelFolded;
            if (STATE.isPanelFolded) {
                panel.style.width = '52px'; panel.style.height = '52px'; panel.style.borderRadius = '26px';
                body.style.opacity = '0'; headerText.style.opacity = '0';
                foldSvg.style.transform = 'rotate(-135deg) scale(1.2)'; foldSvg.style.color = '#FFD700';
                setTimeout(() => { if(STATE.isPanelFolded) body.style.display = 'none'; }, 300);
            } else {
                panel.style.width = '320px'; panel.style.height = 'auto'; panel.style.borderRadius = '12px';
                body.style.display = 'flex';
                setTimeout(() => { body.style.opacity = '1'; headerText.style.opacity = '1'; }, 10);
                foldSvg.style.transform = 'rotate(0deg)'; foldSvg.style.color = '';
            }
        };

        // --- 初始化渲染 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 彻底移除全局雾效，消除“雾蒙蒙”的浑浊感，呈现极致清透的高级全息质感
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000); // 恢复极致深邃的纯黑背景
        container.appendChild(renderer.domElement);

        // --- 光影增强方案 ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.75)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4); 
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(-5, 3, 2);
        scene.add(pointLight);

        // 优化辉光通道设定，提高阈值并减弱强度，彻底消除白茫茫的光污染
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
        bloomPass.threshold = 0.25; bloomPass.strength = 0.5; bloomPass.radius = 0.4;
        composer.addPass(bloomPass);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- 粒子系统 ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const targetNormals = new Float32Array(PARTICLE_COUNT * 3); // 储存采样点的三维法向
        const randoms = new Float32Array(PARTICLE_COUNT);

        // 恢复星云散落初始排布，粒子呈饱满的三维球状星云分布
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = 3 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
            targetPositions[i * 3] = positions[i * 3];
            targetPositions[i * 3 + 1] = positions[i * 3 + 1];
            targetPositions[i * 3 + 2] = positions[i * 3 + 2];
            
            // 初始球状法向向外
            targetNormals[i * 3] = Math.sin(phi) * Math.cos(theta);
            targetNormals[i * 3 + 1] = Math.sin(phi) * Math.sin(theta);
            targetNormals[i * 3 + 2] = Math.cos(phi);
            randoms[i] = Math.random();
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
        geometry.setAttribute('targetNormal', new THREE.BufferAttribute(targetNormals, 3)); 
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        // 重构 Shader 粒子色彩逻辑。恢复为全息星云渐变与法向结合模式
        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorphProgress: { value: 0 },
                uSolidProgress: { value: 0 },
                uScale: { value: 1.0 }, // 传入当前的缩放因子
                // 明亮饱满的高饱和度文物陶金色系
                uColorTop: { value: new THREE.Color('#FFF8DE') },    
                uColorMid: { value: new THREE.Color('#F2A65A') },    
                uColorBottom: { value: new THREE.Color('#A35C30') }  
            },
            vertexShader: `
                uniform float uTime;
                uniform float uMorphProgress;
                uniform float uScale; // 缩放控制信号
                attribute vec3 targetPosition;
                attribute vec3 targetNormal;
                attribute float aRandom;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vLight; // 向下传导的高清光影系数
                uniform vec3 uColorTop;
                uniform vec3 uColorMid;
                uniform vec3 uColorBottom;

                void main() {
                    vec3 chaosPos = position;
                    chaosPos.x += sin(uTime * 0.5 + aRandom * 10.0) * 0.2;
                    chaosPos.y += cos(uTime * 0.6 + aRandom * 10.0) * 0.2;
                    chaosPos.z += sin(uTime * 0.4 + aRandom * 10.0) * 0.2;
                    float easeProgress = smoothstep(0.0, 1.0, uMorphProgress);
                    vec3 finalPos = mix(chaosPos, targetPosition, easeProgress);
                    vPos = finalPos;

                    // --- 法线光影与极清晰体积凹凸算法 ---
                    vec3 viewNormal = normalize((modelViewMatrix * vec4(targetNormal, 0.0)).xyz);
                    
                    // 模拟主光源与侧补光源
                    vec3 lightDir1 = normalize(vec3(0.5, 0.8, 0.6));
                    vec3 lightDir2 = normalize(vec3(-0.6, -0.4, 0.3));
                    
                    // 高对比度半兰伯特光照（极大拓宽阴影过渡，显露文物纹路起伏细节）
                    float diffuse1 = dot(viewNormal, lightDir1) * 0.5 + 0.5;
                    diffuse1 = pow(diffuse1, 2.0); // 强化明暗明晰过渡
                    float diffuse2 = max(dot(viewNormal, lightDir2), 0.0) * 0.2;
                    
                    // 镜面反射高光：在突起表面产生碎金风沙折射
                    vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                    vec3 viewDir = normalize(-mvPosition.xyz);
                    vec3 halfDir = normalize(lightDir1 + viewDir);
                    float spec = pow(max(dot(viewNormal, halfDir), 0.0), 24.0) * 1.8;
                    
                    // 边缘菲涅尔环亮：保持侧棱廓线分明
                    float rim = pow(1.0 - max(dot(viewNormal, viewDir), 0.0), 4.0) * 0.8;
                    
                    // 融合漫反射、镜面和边缘轮廓，形成高对比光照
                    float modelLight = diffuse1 + diffuse2 + spec + rim;
                    vLight = mix(1.0, modelLight, easeProgress);

                    // --- 基于法向光影的立体色彩渐变体系 ---
                    vec3 detailColor;
                    float colorScale = clamp(modelLight * 0.45, 0.0, 1.0);
                    if (colorScale < 0.4) {
                        detailColor = mix(uColorBottom, uColorMid, smoothstep(0.0, 0.4, colorScale));
                    } else {
                        detailColor = mix(uColorMid, uColorTop, smoothstep(0.4, 1.0, colorScale));
                    }

                    // 混沌状态下的纵向高度色彩渐变
                    float mixVal = smoothstep(-2.0, 2.0, finalPos.y);
                    vec3 heightColor;
                    if (mixVal > 0.4) {
                        heightColor = mix(uColorMid, uColorTop, smoothstep(0.4, 1.2, mixVal));
                    } else {
                        heightColor = mix(uColorBottom, uColorMid, smoothstep(0.0, 0.4, mixVal));
                    }

                    // 随变形过渡平滑转化色彩逻辑
                    vColor = mix(heightColor, detailColor, easeProgress);

                    // 模型放大时自动微缩粒子大小，使大瓦当细节依旧锐利，不糊不挤。
                    float sizeFactor = mix(2.5, 1.3, smoothstep(1.0, 2.5, uScale));
                    gl_PointSize = (sizeFactor * (1.0 + aRandom)) / -mvPosition.z;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float uMorphProgress;
                uniform float uSolidProgress;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vLight;
                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    if(length(xy) > 0.5) discard;
                    float scanLine = mix(4.5, -4.5, uSolidProgress);
                    float particleAlpha = 1.0 - smoothstep(scanLine - 0.3, scanLine + 0.3, vPos.y);
                    if (particleAlpha <= 0.0) discard;
                    
                    // 提升环境保底光至 0.45，大幅提亮背光暗部，保证阴影里的粒子在黑色背景下依然可见
                    float ambient = 0.45;
                    float lightFactor = max(vLight, ambient);
                    
                    // 提升整体亮度基数，使模型在空间中熠熠生辉
                    float baseIntensity = mix(1.6, 1.2, smoothstep(0.3, 1.0, uMorphProgress));
                    float intensity = baseIntensity * lightFactor;
                    
                    // 粒子不透明度控制：背阴处粒子保留至少 55% 的不透明度，保证极佳的立体细节
                    float shapeAlpha = smoothstep(0.5, 0.1, length(xy));
                    float alphaFactor = mix(1.0, max(lightFactor, 0.55), uMorphProgress);
                    float finalAlpha = shapeAlpha * particleAlpha * alphaFactor;
                    
                    gl_FragColor = vec4(vColor * intensity, finalAlpha); 
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(geometry, shaderMaterial);
        mainGroup.add(particleSystem);

        // --- 实体材质优化 ---
        function createWadangTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#5a5248'; 
            ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 350000; i++) {
                const x = Math.random() * 1024; const y = Math.random() * 1024;
                ctx.fillStyle = Math.random() > 0.85 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.15)';
                ctx.fillRect(x, y, 2, 2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const solidMaterial = new THREE.MeshStandardMaterial({
            map: createWadangTexture(), 
            roughness: 0.7, 
            metalness: 0.2, 
            color: 0xD2C4B1, 
            transparent: true,
            side: THREE.DoubleSide
        });

        solidMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uSolidProgress = { value: 0 };
            shader.vertexShader = `varying vec3 vLocalPos;\n${shader.vertexShader}`.replace(`#include <begin_vertex>`, `#include <begin_vertex>\nvLocalPos = transformed;`);
            shader.fragmentShader = `uniform float uSolidProgress; varying vec3 vLocalPos;\n${shader.fragmentShader}`.replace(
                `#include <clipping_planes_fragment>`,
                `#include <clipping_planes_fragment>
                float scanLine = mix(4.5, -4.5, uSolidProgress);
                float solidAlpha = smoothstep(scanLine - 0.3, scanLine + 0.3, vLocalPos.y);
                if (solidAlpha <= 0.0) discard;
                gl_FragColor.a *= solidAlpha;
                float edge = abs(vLocalPos.y - scanLine);
                if (edge < 0.25) {
                    gl_FragColor.rgb += vec3(0.95, 0.8, 0.2) * (1.0 - edge/0.25) * 1.6;
                }
                `
            );
            solidMaterial.userData.shader = shader;
        };

        // --- 模型逻辑 ---
        const objLoader = new OBJLoader();
        function parseAndSampleOBJ(objText, callback) {
            try {
                const group = objLoader.parse(objText);
                const geometries = [];
                group.traverse((child) => {
                    if (child.isMesh) {
                        let geom = child.geometry.clone();
                        geom.center();
                        const scale = 1.6 / (geom.boundingSphere || (geom.computeBoundingSphere(), geom.boundingSphere)).radius;
                        geom.scale(scale, scale, scale);
                        geometries.push(geom);
                    }
                });
                if (geometries.length === 0) return callback(false);
                const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
                const sampler = new MeshSurfaceSampler(new THREE.Mesh(mergedGeometry)).build();
                
                const targetPosArray = geometry.attributes.targetPosition.array;
                const targetNormalArray = geometry.attributes.targetNormal.array; // 获取法线数组
                
                const tempPos = new THREE.Vector3();
                const tempNormal = new THREE.Vector3(); // 用于暂存采样的法向

                let currentIdx = 0;
                const batchSize = 15000;
                function processBatch() {
                    const limit = Math.min(currentIdx + batchSize, PARTICLE_COUNT);
                    for (; currentIdx < limit; currentIdx++) {
                        sampler.sample(tempPos, tempNormal); // 采样的同时也获取顶点的表面法向量
                        targetPosArray[currentIdx * 3] = tempPos.x;
                        targetPosArray[currentIdx * 3 + 1] = tempPos.y;
                        targetPosArray[currentIdx * 3 + 2] = tempPos.z;
                        
                        targetNormalArray[currentIdx * 3] = tempNormal.x;
                        targetNormalArray[currentIdx * 3 + 1] = tempNormal.y;
                        targetNormalArray[currentIdx * 3 + 2] = tempNormal.z;
                    }
                    if (currentIdx < PARTICLE_COUNT) { requestAnimationFrame(processBatch); } else {
                        geometry.attributes.targetPosition.needsUpdate = true;
                        geometry.attributes.targetNormal.needsUpdate = true; // 更新 GPU 里的法向属性
                        if (STATE.currentSolidMesh) mainGroup.remove(STATE.currentSolidMesh);
                        mergedGeometry.computeVertexNormals();
                        STATE.currentSolidMesh = new THREE.Mesh(mergedGeometry, solidMaterial);
                        mainGroup.add(STATE.currentSolidMesh);
                        callback(true);
                    }
                }
                processBatch();
            } catch (err) { callback(false); }
        }

        const fileUpload = document.getElementById('file-upload');
        fileUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) { STATE.files.push(...files); updateFileListUI(); if (STATE.currentIndex === -1) switchModelTo(0); }
        });

        function updateFileListUI() {
            document.getElementById('file-count').innerText = `(${STATE.files.length})`;
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            STATE.files.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `px-3 py-2 rounded truncate transition-all duration-300 ${index === STATE.currentIndex ? 'bg-gold/20 text-white border border-gold/30' : 'text-gray-400 border border-transparent'}`;
                li.innerText = file.name; list.appendChild(li);
            });
        }

        async function switchModelTo(index) {
            if (STATE.isMorphing) return;
            STATE.currentIndex = index; updateFileListUI();
            STATE.isSolidMode = false; STATE.solidMorphProgress = 0;
            STATE.isMorphing = true;
            await animateMorph(STATE.morphProgress, 0, 300);

            // 获取文本（通过懒加载函数或真实的File对象皆兼容）
            const text = await STATE.files[index].text();
            
            parseAndSampleOBJ(text, async (success) => {
                if (success) {
                    await animateMorph(0, 1, 1000);
                    STATE.isMorphing = false;
                    generateAICommentary(STATE.files[index].name);
                    const panel = document.getElementById('ai-panel');
                    panel.classList.remove('opacity-0', 'translate-x-12');
                } else { STATE.isMorphing = false; }
            });
        }

        // 动画过渡
        function animateMorph(from, to, duration) {
            return new Promise(resolve => {
                const start = performance.now();
                function update() {
                    const t = Math.min((performance.now() - start) / duration, 1);
                    STATE.morphProgress = from + (to - from) * (t < 0.5 ? 2*t*t : -1+(4-2*t)*t);
                    if (t < 1) requestAnimationFrame(update); else resolve();
                }
                update();
            });
        }

        function generateAICommentary(filename) {
            const aiText = document.getElementById('ai-text');
            const aiTitle = document.getElementById('ai-title');
            const name = filename.replace(/\.[^/.]+$/, "");
            aiTitle.innerText = name;
            let content = `正在感应数字时空频率，解析【${name}】的历史信息。该瓦当承载着高句丽独特的审美与工艺，是研究古代边疆文明的重要数智档案。`;
            for(let key in KNOWLEDGE_BASE) {
                if(name.includes(key)) {
                    content = KNOWLEDGE_BASE[key];
                    break;
                }
            }
            aiText.innerHTML = content;
        }

        // --- 手势追踪 ---
        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        
        hands.onResults((results) => {
            const canvas = document.getElementById('hands-canvas');
            const ctx = canvas.getContext('2d');
            ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-green-500';
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#FFD700', lineWidth: 2});
                STATE.targetRotationY = -(landmarks[9].x - 0.5) * Math.PI * 2.5;
                const pitch = (landmarks[9].y - landmarks[0].y) / Math.hypot(landmarks[9].x-landmarks[0].x, landmarks[9].y-landmarks[0].y);
                STATE.targetRotationX = Math.max(0, Math.min((pitch + 0.4) * Math.PI * 1.2, Math.PI));
                
                // 1. 各手指弯曲判定（比较指尖到手腕与PIP关节到手腕的距离，完美适应手部任意旋转角度）
                const indexFolded = Math.hypot(landmarks[8].x - landmarks[0].x, landmarks[8].y - landmarks[0].y) < Math.hypot(landmarks[6].x - landmarks[0].x, landmarks[6].y - landmarks[0].y);
                const middleFolded = Math.hypot(landmarks[12].x - landmarks[0].x, landmarks[12].y - landmarks[0].y) < Math.hypot(landmarks[10].x - landmarks[0].x, landmarks[10].y - landmarks[0].y);
                const ringFolded = Math.hypot(landmarks[16].x - landmarks[0].x, landmarks[16].y - landmarks[0].y) < Math.hypot(landmarks[14].x - landmarks[0].x, landmarks[14].y - landmarks[0].y);
                const pinkyFolded = Math.hypot(landmarks[20].x - landmarks[0].x, landmarks[20].y - landmarks[0].y) < Math.hypot(landmarks[18].x - landmarks[0].x, landmarks[18].y - landmarks[0].y);

                // 2. 握拳判定：中指、无名指、小指、食指中，至少有3个手指是弯曲折叠状态
                const foldedCount = (indexFolded ? 1 : 0) + (middleFolded ? 1 : 0) + (ringFolded ? 1 : 0) + (pinkyFolded ? 1 : 0);
                const isFist = foldedCount >= 3;

                // 3. OK手势判定：食指与拇指指尖捏合，且中、无名、小指必须均呈伸展状态
                const pinch = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
                const isOK = pinch < 0.05 && !middleFolded && !ringFolded && !pinkyFolded;

                STATE.targetScale = Math.max(0.6, Math.min(pinch * 5.0, 2.5));
                const deltaTime = (performance.now() - STATE.lastFrameTime) / 1000;
                STATE.lastFrameTime = performance.now();

                if (isFist) {
                    if (!STATE.isCooldown && !STATE.isMorphing) {
                        STATE.actionProgress += deltaTime / 1.0; 
                        if (STATE.actionProgress >= 1) { 
                            STATE.actionProgress = 0; STATE.isSolidMode = !STATE.isSolidMode;
                            STATE.isCooldown = true; setTimeout(() => STATE.isCooldown = false, 800);
                        }
                    }
                } else if (isOK && STATE.files.length > 1) {
                    STATE.actionProgress += deltaTime / 1.5; 
                    if (STATE.actionProgress >= 1) { STATE.actionProgress = 0; switchModelTo((STATE.currentIndex + 1) % STATE.files.length); }
                } else { STATE.actionProgress = Math.max(0, STATE.actionProgress - deltaTime * 3); }
                document.getElementById('progress-ring').style.strokeDashoffset = 282.7 * (1 - Math.min(STATE.actionProgress, 1));
            } else { document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-red-500'; }
            ctx.restore();
        });

        document.getElementById('start-cam-overlay').addEventListener('click', () => {
            document.getElementById('start-cam-overlay').style.display = 'none';
            document.getElementById('hands-canvas').classList.remove('opacity-0');
            new Camera(document.getElementById('video-input'), { onFrame: async () => await hands.send({image: document.getElementById('video-input')}), width: 320, height: 180 }).start();
        });

        // --- 鼠标滚轮、点击拖拽旋转、平板捏合缩放、双击及长按逻辑 ---
        let isPointerDown = false;
        let pointerStart = { x: 0, y: 0 };
        let pointerLast = { x: 0, y: 0 };
        let activePointers = [];
        let initialPinchDist = 0;
        let initialTargetScale = 1.0;
        let longPressTimer = null;
        let lastPointerDownTime = 0;

        // 计算双指间距
        function getDistance(p1, p2) {
            return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
        }

        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.glass-panel') || e.target.closest('button') || e.target.closest('label') || e.target.closest('input')) return;
            
            isPointerDown = true;
            activePointers.push(e);
            pointerStart = { x: e.clientX, y: e.clientY };
            pointerLast = { x: e.clientX, y: e.clientY };

            const now = performance.now();
            // 连续快速双击两下切换虚实转化
            if (now - lastPointerDownTime < 300) {
                if (!STATE.isMorphing) {
                    STATE.isSolidMode = !STATE.isSolidMode;
                }
                if (longPressTimer) clearTimeout(longPressTimer);
            } else {
                // 点击长按逻辑，按住 800ms 切换下一个模型
                if (longPressTimer) clearTimeout(longPressTimer);
                longPressTimer = setTimeout(() => {
                    if (STATE.files.length > 1 && !STATE.isMorphing) {
                        switchModelTo((STATE.currentIndex + 1) % STATE.files.length);
                    }
                }, 800);
            }
            lastPointerDownTime = now;

            if (activePointers.length === 2) {
                initialPinchDist = getDistance(activePointers[0], activePointers[1]);
                initialTargetScale = STATE.targetScale;
                if (longPressTimer) clearTimeout(longPressTimer);
            }
        });

        container.addEventListener('pointermove', (e) => {
            const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
            if (idx !== -1) activePointers[idx] = e;

            if (!isPointerDown) return;

            // 移动超出 10px 即取消长按判定
            const distMoved = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
            if (distMoved > 10 && longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }

            if (activePointers.length === 1) {
                // 鼠标/单指拖拽旋转模型
                const dx = e.clientX - pointerLast.x;
                const dy = e.clientY - pointerLast.y;
                STATE.targetRotationY += dx * 0.008;
                STATE.targetRotationX = Math.max(-Math.PI, Math.min(STATE.targetRotationX + dy * 0.008, Math.PI));
                pointerLast = { x: e.clientX, y: e.clientY };
            } else if (activePointers.length === 2) {
                // 双指捏合放大缩小模型
                const dist = getDistance(activePointers[0], activePointers[1]);
                if (initialPinchDist > 0) {
                    const factor = dist / initialPinchDist;
                    STATE.targetScale = Math.max(0.6, Math.min(initialTargetScale * factor, 2.5));
                }
            }
        });

        const endPointer = (e) => {
            isPointerDown = false;
            activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
            if (activePointers.length < 2) {
                initialPinchDist = 0;
            }
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        };

        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);

        // 鼠标滚轮缩放模型
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.08;
            const delta = -Math.sign(e.deltaY);
            STATE.targetScale = Math.max(0.6, Math.min(STATE.targetScale + delta * zoomSpeed, 2.5));
        }, { passive: false });

        // --- 触发懒加载预存 ---
        initPreloadModels();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() / 1000;
            shaderMaterial.uniforms.uTime.value = time;
            shaderMaterial.uniforms.uMorphProgress.value = STATE.morphProgress;
            STATE.solidMorphProgress = THREE.MathUtils.lerp(STATE.solidMorphProgress, STATE.isSolidMode ? 1 : 0, 0.04);
            shaderMaterial.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            if (solidMaterial.userData.shader) solidMaterial.userData.shader.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            
            // 提高旋转惯性过渡速度（从 0.08 提高到 0.22），使鼠标松开/停下后模型立刻精确刹车，不发生漂移
            STATE.currentRotationY = THREE.MathUtils.lerp(STATE.currentRotationY, STATE.targetRotationY, 0.22);
            STATE.currentRotationX = THREE.MathUtils.lerp(STATE.currentRotationX, STATE.targetRotationX, 0.22);
            STATE.currentScale = THREE.MathUtils.lerp(STATE.currentScale, STATE.targetScale, 0.1);
            
            // 将实时缩放因子传递给 Shader，动态改变粒子呈现尺寸
            shaderMaterial.uniforms.uScale.value = STATE.currentScale;

            mainGroup.rotation.set(STATE.currentRotationX, STATE.currentRotationY, 0);
            mainGroup.scale.setScalar(STATE.currentScale);
            mainGroup.position.y = Math.sin(time * 0.5) * 0.1;
            composer.render();
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <script>
        // 监听来自父页面（Unity）的消息并处理（可选）
        window.addEventListener('message', function(event) {
            if (event.data === 'fromParent: i am ready') {
                console.log('手势网站已准备好与 Unity 父页面通信');
            }
        });

        // 当用户点击返回按钮时，通知父页面关闭手势覆盖层
        document.getElementById('backToUnityBtn').addEventListener('click', function() {
            window.parent.postMessage('fromGesture: close me', '*');
        });
    </script>
</body>
