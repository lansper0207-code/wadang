<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高句丽瓦当数智化手势交互 | Goguryeo Particle System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#FFD700',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; overflow: hidden; margin: 0; user-select: none; touch-action: none; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        #progress-ring {
            transition: stroke-dashoffset 0.05s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .panel-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 优化滚轮触屏体验 */
        #wheel-interactive-area {
            touch-action: none;
        }
    </style>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body class="text-white font-sans h-screen w-screen">

    <div id="canvas-container" class="absolute inset-0 z-0" style="touch-action: none;"></div>

    <!-- Title UI -->
    <div class="absolute left-10 top-10 z-10 pointer-events-none">
        <h1 class="text-[32px] md:text-[42px] font-normal tracking-[0.18em] text-white/90 drop-shadow-[0_2px_10px_rgba(0,0,0,0.8)] mb-3">
            高句丽瓦当数智化手势交互
        </h1>
        <p class="text-xs md:text-[13px] text-white/60 font-light tracking-[0.35em] uppercase mb-4">
            Goguryeo Wadang Digital Gesture Interaction
        </p>
        <div class="w-64 h-[1px] bg-gradient-to-r from-gold/50 to-transparent mb-6"></div>

        <button id="backToUnityBtn" class="pointer-events-auto px-5 py-2.5 glass-panel rounded-lg text-xs tracking-widest text-white/80 hover:text-gold hover:border-gold/50 hover:bg-white/10 transition-all duration-300 flex items-center gap-2 backdrop-blur-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            完成手势，返回
        </button>
    </div>

    <!-- Left Center Wheel Selector UI (新建转盘拖拽选择区域，支持拖拽、吸附、滚轮与拼音显示) -->
    <div id="wheel-selector-container" class="absolute left-0 top-0 bottom-0 w-[300px] z-10 pointer-events-none flex items-center justify-start overflow-hidden">
        <!-- 仅中间区域响应手势，防止跟顶部标题和底部视频组件手势冲突，位置稍微往下移（top-10% bottom-30%） -->
        <div id="wheel-interactive-area" class="pointer-events-auto absolute left-0 top-[10%] bottom-[30%] w-[280px] cursor-grab active:cursor-grabbing">
            <!-- SVG Arc Track -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none">
                <defs>
                    <!-- 辉光滤镜，提供高亮光晕支持 -->
                    <filter id="wheel-svg-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <!-- Outer Glowing Arc Track (外环辉光轨道) -->
                <path id="wheel-arc-track" d="" fill="none" stroke="rgba(255, 215, 0, 0.12)" stroke-width="2.5" filter="url(#wheel-svg-glow)" />
                <!-- Inner Dashed Track (内环刻度虚线) -->
                <path id="wheel-arc-dash" d="" fill="none" stroke="rgba(255, 215, 0, 0.2)" stroke-width="1.5" stroke-dasharray="3, 5" />
                <!-- Focus Target Indicator Line & Dot at 0 degrees -->
                <line id="wheel-focus-pointer" x1="0" y1="0" x2="0" y2="0" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" filter="url(#wheel-svg-glow)" />
                <circle id="wheel-focus-dot" cx="0" cy="0" r="5" fill="#FFD700" filter="drop-shadow(0 0 6px rgba(255, 215, 0, 0.8))" />
            </svg>
            <!-- Dynamic Items Labels Container -->
            <div id="wheel-items" class="absolute inset-0 pointer-events-none"></div>
        </div>
    </div>

    <!-- Collapsible Upload Panel -->
    <div id="upload-panel" class="absolute right-8 top-8 w-80 glass-panel rounded-xl flex flex-col z-20 panel-transition max-h-[50vh] overflow-hidden">
        <div id="panel-header" class="flex items-center justify-between p-4 border-b border-white/10 cursor-pointer hover:bg-white/5 transition-colors" onclick="toggleUploadPanel()">
            <div id="header-content" class="flex items-center gap-2">
                <svg class="w-4 h-4 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span class="text-sm font-light tracking-widest text-white/90">数据模型导入</span>
            </div>
            <button id="fold-icon-wrapper" class="text-white/40 hover:text-white">

        <div id="panel-body" class="p-5 flex flex-col gap-4 overflow-hidden opacity-100 transition-opacity duration-300">
            <div>
                <label for="file-upload" class="cursor-pointer flex items-center justify-center w-full h-14 border border-dashed border-white/20 hover:border-white/80 hover:bg-white/5 rounded-lg transition-all duration-300">
                    <span class="text-xs tracking-widest font-light text-gray-300">点击选择 OBJ 多文件</span>

            <div class="flex-1 overflow-y-auto min-h-0">

    <!-- AI Knowledge Card -->
    <div class="absolute bottom-16 right-10 w-[420px] glass-panel rounded-2xl p-8 z-10 transition-all duration-700 opacity-0 transform translate-x-12" id="ai-panel">
        <div class="flex items-start gap-4 mb-6">
            <div class="w-1.5 h-10 bg-gold mt-1"></div>

        <div class="relative">

        <div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center">
            <span class="text-[11px] text-white/30 tracking-[0.3em] uppercase font-light">Goguryeo Digital Archive</span>
            <div class="flex gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-gold/60 animate-pulse"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-gold/30"></div>

    <!-- Gesture Overlay -->
    <div class="absolute bottom-8 left-10 w-72 aspect-video glass-panel rounded-xl overflow-hidden z-10 shadow-2xl group">
        <video id="video-input" class="hidden"></video>
        <canvas id="hands-canvas" class="w-full h-full object-cover transform scale-x-[-1] opacity-0 transition-opacity duration-500"></canvas>
        
        <div id="start-cam-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm cursor-pointer hover:bg-black/40 transition-all duration-300 z-20 text-center">
            <svg class="w-10 h-10 text-white/50 mb-3 group-hover:text-gold transition-colors duration-300 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <span class="text-[10px] tracking-widest text-white/70 font-light block mb-1">点击开启手势交互</span>
            <span class="text-[9px] tracking-wider text-gray-500 font-light block px-2">手势(OK/握拳) 或 鼠标/触屏(拖拽旋转/滚轮/双击/长按)</span>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <svg class="w-14 h-14 opacity-80" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>
                <circle id="progress-ring" cx="50" cy="50" r="45" fill="none" stroke="#FFD700" stroke-width="4" 
                        stroke-dasharray="282.7" stroke-dashoffset="282.7" stroke-linecap="round"/>
            </svg>
        </div>
        
        <div class="absolute top-2 left-2 bg-black/50 rounded px-2 py-1 text-[9px] text-white/80 backdrop-blur flex items-center gap-2 z-10">
            <div id="cam-status" class="w-1.5 h-1.5 rounded-full bg-gray-500"></div>
            <span id="cam-status-text">追踪识别中</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 优化后的滚轮转盘核心物理、布局参数（位置上移后微调向下：centerY 从 35% 调整到 40%） ---
        const R = 300;             // 往外拉伸：转盘半径增加，获得更开阔柔和的轨迹
        const X_c = -190;          // 往外偏移：中心向左推移，使得弧度仅部分露在屏内
        const beta = 0.45;         // 每项的弧角间隔
        
        // 动态计算垂直中轴（下移至 40% 高度处，比之前的 35% 稍低，更加舒适）
        function getWheelCenterY() {
            return window.innerHeight * 0.40; 
        }

        // --- 全局状态 ---
        const PARTICLE_COUNT = 300000;
        const STATE = {
            files: [], 
            currentIndex: -1, 
            isMorphing: false, 
            morphProgress: 0, 
            isSolidMode: false, 
            solidMorphProgress: 0, 
            currentSolidMesh: null,
            targetRotationY: 0, currentRotationY: 0, 
            targetRotationX: 0, currentRotationX: 0,
            targetScale: 1.0, currentScale: 1.0, 
            actionProgress: 0, 
            isCooldown: false,
            lastFrameTime: performance.now(),
            isPanelFolded: false,
            // 转盘选择器角度控制
            wheelAngle: 0,
            targetWheelAngle: 0
        };

        const KNOWLEDGE_BASE = {
            "兽面纹": "兽面纹瓦当的数量在高句丽时期仅次于莲花纹瓦当。兽面纹瓦当多是与中原文化中的兽纹与饕餮纹演化而来的。高句丽受其影响注入了东北地区东北虎的形象。从而形成了高句丽人典型的兽面纹饰题材。<br><br>兽面纹的形成也是一种对强者的崇拜，寓意着强大，力量，牢固与邪祟不得靠近的庄严形象。",
            "莲花纹": "莲花纹瓦当在中原地区出现及少，只有秦代有少量的出土发现。而高句丽瓦当纹饰中莲花纹数量占有较大的比例。从莲花纹可以看出：对高句丽祖先的传说信仰的传承、中原文化与艺术对莲花的高度赞誉与喜爱、佛教传入对其信仰的影响和对女性生殖崇拜的解读。<br><br>莲花纹饰寓意着高尚品格和对永恒生命力的向往。",
            "卷云纹": "卷云纹瓦当在春秋时期就已出现了，秦汉时期得以规范。而高句丽卷云纹文字瓦当只在集安地区发现。汉代汉武帝设立四郡以来，玄菟郡与辽东地区接近，所以这时期的卷云纹瓦当也深受其文化和艺术上的影响。<br><br>卷云纹也寓意着风云如意，瑞雪宜年的美好愿望。",
            "忍冬纹": "忍冬纹瓦当在相当长的一段时间中被国内学者认为只有在吉林省集安市有出土发现。但是随着信息的发达与各国之间的文化艺术交流，在朝鲜也先后有所发现。忍冬也称“金银花”“二花”。是一种多年生半常绿缠绕灌木，抗严寒等恶劣环境。东汉末期开始作为一种纹饰出现在绘画雕刻等艺术形式之上。<br><br>忍冬纹寓意着高句丽人的运动精神与对抗大自然严酷环境的一种强大决心。"
        };

        // --- 核心预存逻辑：懒加载伪装模型库 ---
        const PRELOAD_MODELS = [
            { name: "兽面纹瓦当.obj", path: "models/shoumian_wadang.obj", pinyin: "SHOU MIAN WEN WA DANG" },
            { name: "莲花纹瓦当.obj", path: "models/lianhua_wadang.obj", pinyin: "LIAN HUA WEN WA DANG" },
            { name: "卷云纹瓦当.obj", path: "models/juanyun_wadang.obj", pinyin: "JUAN YUN WEN WA DANG" },
            { name: "忍冬纹瓦当.obj", path: "models/rendong_wadang.obj", pinyin: "REN DONG WEN WA DANG" }
        ];

        function initPreloadModels() {
            PRELOAD_MODELS.forEach(item => {
                STATE.files.push({
                    name: item.name,
                    pinyin: item.pinyin,
                    // 【懒加载核心】只有在真正被选中时去请求真实 obj
                    text: async () => {
                        try {
                            const response = await fetch(item.path);
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            return await response.text();
                        } catch (error) {
                            console.error(`无法加载预存模型 [${item.name}]，将采用极简占位几何体:`, error);
                            return "v -1 -1 1\nv 1 -1 1\nv -1 1 1\nv 1 1 1\nv -1 -1 -1\nv 1 -1 -1\nv -1 1 -1\nv 1 1 -1\nf 1 2 4 3\nf 3 4 8 7\nf 7 8 6 5\nf 5 6 2 1\nf 3 7 5 1\nf 2 6 8 4";
                        }
                    }
                });
            });

            if (STATE.files.length > 0) {
                updateFileListUI();
                initWheelUI();
                initWheelInteractions();
                switchModelTo(0); 
            }
        }
        // ------------------------------------

        window.toggleUploadPanel = function() {
            const panel = document.getElementById('upload-panel');
            const body = document.getElementById('panel-body');
            const headerText = document.getElementById('header-content');
            const foldSvg = document.getElementById('fold-svg');
            STATE.isPanelFolded = !STATE.isPanelFolded;
            if (STATE.isPanelFolded) {
                panel.style.width = '52px'; panel.style.height = '52px'; panel.style.borderRadius = '26px';
                body.style.opacity = '0'; headerText.style.opacity = '0';
                foldSvg.style.transform = 'rotate(-135deg) scale(1.2)'; foldSvg.style.color = '#FFD700';
                setTimeout(() => { if(STATE.isPanelFolded) body.style.display = 'none'; }, 300);
            } else {
                panel.style.width = '320px'; panel.style.height = 'auto'; panel.style.borderRadius = '12px';
                body.style.display = 'flex';
                setTimeout(() => { body.style.opacity = '1'; headerText.style.opacity = '1'; }, 10);
                foldSvg.style.transform = 'rotate(0deg)'; foldSvg.style.color = '';
            }
        };

        // --- 初始化三维场景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000); 
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4); 
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(-5, 3, 2);
        scene.add(pointLight);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
        bloomPass.threshold = 0.25; bloomPass.strength = 0.5; bloomPass.radius = 0.4;
        composer.addPass(bloomPass);

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- 粒子系统创建 ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const targetNormals = new Float32Array(PARTICLE_COUNT * 3); 
        const randoms = new Float32Array(PARTICLE_COUNT);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const r = 3 * Math.cbrt(Math.random());
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
            targetPositions[i * 3] = positions[i * 3];
            targetPositions[i * 3 + 1] = positions[i * 3 + 1];
            targetPositions[i * 3 + 2] = positions[i * 3 + 2];
            
            targetNormals[i * 3] = Math.sin(phi) * Math.cos(theta);
            targetNormals[i * 3 + 1] = Math.sin(phi) * Math.sin(theta);
            targetNormals[i * 3 + 2] = Math.cos(phi);
            randoms[i] = Math.random();
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));
        geometry.setAttribute('targetNormal', new THREE.BufferAttribute(targetNormals, 3)); 
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorphProgress: { value: 0 },
                uSolidProgress: { value: 0 },
                uScale: { value: 1.0 }, 
                uColorTop: { value: new THREE.Color('#FFF8DE') },    
                uColorMid: { value: new THREE.Color('#F2A65A') },    
                uColorBottom: { value: new THREE.Color('#A35C30') }  
            },
            vertexShader: `
                uniform float uTime;
                uniform float uMorphProgress;
                uniform float uScale;
                attribute vec3 targetPosition;
                attribute vec3 targetNormal;
                attribute float aRandom;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vLight;
                uniform vec3 uColorTop;
                uniform vec3 uColorMid;
                uniform vec3 uColorBottom;

                void main() {
                    vec3 chaosPos = position;
                    chaosPos.x += sin(uTime * 0.5 + aRandom * 10.0) * 0.2;
                    chaosPos.y += cos(uTime * 0.6 + aRandom * 10.0) * 0.2;
                    chaosPos.z += sin(uTime * 0.4 + aRandom * 10.0) * 0.2;
                    float easeProgress = smoothstep(0.0, 1.0, uMorphProgress);
                    vec3 finalPos = mix(chaosPos, targetPosition, easeProgress);
                    vPos = finalPos;

                    vec3 viewNormal = normalize((modelViewMatrix * vec4(targetNormal, 0.0)).xyz);
                    vec3 lightDir1 = normalize(vec3(0.5, 0.8, 0.6));
                    vec3 lightDir2 = normalize(vec3(-0.6, -0.4, 0.3));
                    
                    float diffuse1 = dot(viewNormal, lightDir1) * 0.5 + 0.5;
                    diffuse1 = pow(diffuse1, 2.0);
                    float diffuse2 = max(dot(viewNormal, lightDir2), 0.0) * 0.2;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                    vec3 viewDir = normalize(-mvPosition.xyz);
                    vec3 halfDir = normalize(lightDir1 + viewDir);
                    float spec = pow(max(dot(viewNormal, halfDir), 0.0), 24.0) * 1.8;
                    
                    float rim = pow(1.0 - max(dot(viewNormal, viewDir), 0.0), 4.0) * 0.8;
                    float modelLight = diffuse1 + diffuse2 + spec + rim;
                    vLight = mix(1.0, modelLight, easeProgress);

                    vec3 detailColor;
                    float colorScale = clamp(modelLight * 0.45, 0.0, 1.0);
                    if (colorScale < 0.4) {
                        detailColor = mix(uColorBottom, uColorMid, smoothstep(0.0, 0.4, colorScale));
                    } else {
                        detailColor = mix(uColorMid, uColorTop, smoothstep(0.4, 1.0, colorScale));
                    }

                    float mixVal = smoothstep(-2.0, 2.0, finalPos.y);
                    vec3 heightColor;
                    if (mixVal > 0.4) {
                        heightColor = mix(uColorMid, uColorTop, smoothstep(0.4, 1.2, mixVal));
                    } else {
                        heightColor = mix(uColorBottom, uColorMid, smoothstep(0.0, 0.4, mixVal));
                    }

                    vColor = mix(heightColor, detailColor, easeProgress);
                    float sizeFactor = mix(2.5, 1.3, smoothstep(1.0, 2.5, uScale));
                    gl_PointSize = (sizeFactor * (1.0 + aRandom)) / -mvPosition.z;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform float uMorphProgress;
                uniform float uSolidProgress;
                varying vec3 vColor;
                varying vec3 vPos;
                varying float vLight;
                void main() {
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    if(length(xy) > 0.5) discard;
                    float scanLine = mix(4.5, -4.5, uSolidProgress);
                    float particleAlpha = 1.0 - smoothstep(scanLine - 0.3, scanLine + 0.3, vPos.y);
                    if (particleAlpha <= 0.0) discard;
                    
                    float ambient = 0.45;
                    float lightFactor = max(vLight, ambient);
                    float baseIntensity = mix(1.6, 1.2, smoothstep(0.3, 1.0, uMorphProgress));
                    float intensity = baseIntensity * lightFactor;
                    
                    float shapeAlpha = smoothstep(0.5, 0.1, length(xy));
                    float alphaFactor = mix(1.0, max(lightFactor, 0.55), uMorphProgress);
                    float finalAlpha = shapeAlpha * particleAlpha * alphaFactor;
                    
                    gl_FragColor = vec4(vColor * intensity, finalAlpha); 
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const particleSystem = new THREE.Points(geometry, shaderMaterial);
        mainGroup.add(particleSystem);

        // --- 实体模型材质设定 ---
        function createWadangTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            // 将基础背景颜色微调调亮，避免暗沉
            ctx.fillStyle = '#9c866d'; 
            ctx.fillRect(0, 0, 1024, 1024);
            for (let i = 0; i < 350000; i++) {
                const x = Math.random() * 1024; const y = Math.random() * 1024;
                ctx.fillStyle = Math.random() > 0.85 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.15)';
                ctx.fillRect(x, y, 2, 2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const solidMaterial = new THREE.MeshStandardMaterial({
            map: createWadangTexture(), 
            roughness: 0.88, // 保持精致的哑光、散光漫反射质感
            metalness: 0.05, // 保持低金属度的古朴历史风化感
            // 微微调亮反射色，使模型在阴影区也拥有暖洋洋的透亮感
            color: 0xE2CDAD, 
            transparent: true,
            side: THREE.DoubleSide
        });

        solidMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uSolidProgress = { value: 0 };
            shader.vertexShader = `varying vec3 vLocalPos;\n${shader.vertexShader}`.replace(`#include <begin_vertex>`, `#include <begin_vertex>\nvLocalPos = transformed;`);
            shader.fragmentShader = `uniform float uSolidProgress; varying vec3 vLocalPos;\n${shader.fragmentShader}`.replace(
                `#include <clipping_planes_fragment>`,
                `#include <clipping_planes_fragment>
                float scanLine = mix(4.5, -4.5, uSolidProgress);
                float solidAlpha = smoothstep(scanLine - 0.3, scanLine + 0.3, vLocalPos.y);
                if (solidAlpha <= 0.0) discard;
                gl_FragColor.a *= solidAlpha;
                float edge = abs(vLocalPos.y - scanLine);
                if (edge < 0.25) {
                    gl_FragColor.rgb += vec3(0.95, 0.8, 0.2) * (1.0 - edge/0.25) * 1.6;
                }
                `
            );
            solidMaterial.userData.shader = shader;
        };

        // --- OBJ采样与转换计算 ---
        const objLoader = new OBJLoader();
        function parseAndSampleOBJ(objText, callback) {
            try {
                const group = objLoader.parse(objText);
                const geometries = [];
                group.traverse((child) => {
                    if (child.isMesh) {
                        let geom = child.geometry.clone();
                        geom.center();
                        const scale = 1.6 / (geom.boundingSphere || (geom.computeBoundingSphere(), geom.boundingSphere)).radius;
                        geom.scale(scale, scale, scale);
                        geometries.push(geom);
                    }
                });
                if (geometries.length === 0) return callback(false);
                const mergedGeometry = BufferGeometryUtils.mergeGeometries(geometries);
                const sampler = new MeshSurfaceSampler(new THREE.Mesh(mergedGeometry)).build();
                
                const targetPosArray = geometry.attributes.targetPosition.array;
                const targetNormalArray = geometry.attributes.targetNormal.array; 
                
                const tempPos = new THREE.Vector3();
                const tempNormal = new THREE.Vector3(); 

                let currentIdx = 0;
                const batchSize = 15000;
                function processBatch() {
                    const limit = Math.min(currentIdx + batchSize, PARTICLE_COUNT);
                    for (; currentIdx < limit; currentIdx++) {
                        sampler.sample(tempPos, tempNormal); 
                        targetPosArray[currentIdx * 3] = tempPos.x;
                        targetPosArray[currentIdx * 3 + 1] = tempPos.y;
                        targetPosArray[currentIdx * 3 + 2] = tempPos.z;
                        
                        targetNormalArray[currentIdx * 3] = tempNormal.x;
                        targetNormalArray[currentIdx * 3 + 1] = tempNormal.y;
                        targetNormalArray[currentIdx * 3 + 2] = tempNormal.z;
                    }
                    if (currentIdx < PARTICLE_COUNT) { requestAnimationFrame(processBatch); } else {
                        geometry.attributes.targetPosition.needsUpdate = true;
                        geometry.attributes.targetNormal.needsUpdate = true; 
                        if (STATE.currentSolidMesh) mainGroup.remove(STATE.currentSolidMesh);
                        mergedGeometry.computeVertexNormals();
                        STATE.currentSolidMesh = new THREE.Mesh(mergedGeometry, solidMaterial);
                        mainGroup.add(STATE.currentSolidMesh);
                        callback(true);
                    }
                }
                processBatch();
            } catch (err) { callback(false); }
        }

        const fileUpload = document.getElementById('file-upload');
        fileUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) { STATE.files.push(...files); updateFileListUI(); if (STATE.currentIndex === -1) switchModelTo(0); }
        });

        function updateFileListUI() {
            document.getElementById('file-count').innerText = `(${STATE.files.length})`;
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            STATE.files.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `px-3 py-2 rounded truncate transition-all duration-300 cursor-pointer hover:bg-white/5 ${index === STATE.currentIndex ? 'bg-gold/20 text-white border border-gold/30' : 'text-gray-400 border border-transparent'}`;
                li.innerText = file.name;
                li.addEventListener('click', () => {
                    switchModelTo(index);
                });
                list.appendChild(li);
            });
        }

        // --- 3D转盘选择器渲染、交互函数 (升级为纯白发光字，点控拖拽与直线滚动机制) ---
        function initWheelUI() {
            const container = document.getElementById('wheel-items');
            if (!container) return;
            container.innerHTML = '';

            PRELOAD_MODELS.forEach((model, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'absolute pointer-events-auto cursor-pointer flex items-center gap-5 transition-all duration-300 select-none';
                itemDiv.id = `wheel-item-${i}`;
                itemDiv.innerHTML = `
                    <!-- 极简日冕双环指示器 -->
                    <div class="relative flex items-center justify-center w-5 h-5">
                        <div class="absolute w-3 h-3 rounded-full border border-gold/30 transition-all duration-300" id="wheel-dot-outer-${i}"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-gold/50 transition-all duration-300" id="wheel-dot-${i}"></div>
                    </div>
                    <!-- 瓦当名称与拼音副标题 -->
                    <div class="flex flex-col">
                        <span class="text-[15px] font-normal tracking-[0.16em] transition-all duration-300" id="wheel-text-${i}">${model.name.replace('.obj', '')}</span>
                        <span class="text-[9px] uppercase tracking-[0.22em] scale-90 origin-left opacity-0 transition-all duration-300" id="wheel-subtext-${i}">${model.pinyin}</span>
                    </div>
                `;
                
                itemDiv.addEventListener('click', () => {
                    if (!STATE.isMorphing) {
                        switchModelTo(i);
                    }
                });
                container.appendChild(itemDiv);
            });
            setupWheelLayout();
        }

        // 动态计算 SVG 的圆弧路径与刻度位置（高度调至40%，并外移）
        function setupWheelLayout() {
            const centerY = getWheelCenterY(); 
            const arcTrack = document.getElementById('wheel-arc-track');
            const arcDash = document.getElementById('wheel-arc-dash');
            const focusPointer = document.getElementById('wheel-focus-pointer');
            const focusDot = document.getElementById('wheel-focus-dot');

            if (!arcTrack) return;

            const startAngle = -1.0;
            const endAngle = 1.0;
            
            const x1 = X_c + R * Math.cos(startAngle);
            const y1 = centerY + R * Math.sin(startAngle);
            const x2 = X_c + R * Math.cos(endAngle);
            const y2 = centerY + R * Math.sin(endAngle);

            arcTrack.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
            arcDash.setAttribute('d', `M ${x1 - 10} ${y1} A ${R - 10} ${R - 10} 0 0 1 ${x2 - 10} ${y2}`);

            const focusX = X_c + R;
            const focusY = centerY;
            focusPointer.setAttribute('x1', focusX - 15);
            focusPointer.setAttribute('y1', focusY);
            focusPointer.setAttribute('x2', focusX + 15);
            focusPointer.setAttribute('y2', focusY);

            focusDot.setAttribute('cx', focusX);
            focusDot.setAttribute('cy', focusY);
        }

        // 滚轮交互阻尼惯性算法：融合弧位拖动、直觉式垂直位移与滚轮
        function initWheelInteractions() {
            const dragArea = document.getElementById('wheel-interactive-area');
            const selectorContainer = document.getElementById('wheel-selector-container');
            if (!dragArea) return;

            let isDraggingWheel = false;
            let dragStartY = 0;
            let dragStartWheelAngle = 0;

            dragArea.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                isDraggingWheel = true;
                dragArea.setPointerCapture(e.pointerId);

                dragStartY = e.clientY; 
                dragStartWheelAngle = STATE.targetWheelAngle;
            });

            dragArea.addEventListener('pointermove', (e) => {
                if (!isDraggingWheel) return;
                e.stopPropagation();

                // 物理惯性：将直觉式的线性上下滑动直接解算为物理角旋转
                let deltaY = e.clientY - dragStartY;
                let deltaAngle = deltaY * 0.004; 

                let targetAngle = dragStartWheelAngle + deltaAngle;

                const minClamp = -3 * beta - 0.35;
                const maxClamp = 0 * beta + 0.35;
                STATE.targetWheelAngle = Math.max(minClamp, Math.min(targetAngle, maxClamp));
            });

            const endDrag = (e) => {
                if (!isDraggingWheel) return;
                isDraggingWheel = false;
                dragArea.releasePointerCapture(e.pointerId);

                const closestIndex = Math.max(0, Math.min(Math.round(-STATE.targetWheelAngle / beta), 3));
                STATE.targetWheelAngle = -closestIndex * beta;

                if (closestIndex !== STATE.currentIndex && !STATE.isMorphing) {
                    switchModelTo(closestIndex);
                }
            };

            dragArea.addEventListener('pointerup', endDrag);
            dragArea.addEventListener('pointercancel', endDrag);

            if (selectorContainer) {
                selectorContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 

                    if (STATE.isMorphing) return;

                    const direction = Math.sign(e.deltaY);
                    let nextIndex = STATE.currentIndex + direction;
                    nextIndex = Math.max(0, Math.min(nextIndex, PRELOAD_MODELS.length - 1));

                    if (nextIndex !== STATE.currentIndex) {
                        switchModelTo(nextIndex);
                    }
                }, { passive: false });
            }
        }

        // 帧刷新转盘高规格视觉：选中项文字完美升级为纯白色，散发尊贵白金全息辉光
        function updateWheel() {
            STATE.wheelAngle = THREE.MathUtils.lerp(STATE.wheelAngle, STATE.targetWheelAngle, 0.25);

            const centerY = getWheelCenterY();
            
            PRELOAD_MODELS.forEach((model, i) => {
                const itemDiv = document.getElementById(`wheel-item-${i}`);
                if (!itemDiv) return;

                const angle = i * beta + STATE.wheelAngle;
                const dotX = X_c + R * Math.cos(angle);
                const dotY = centerY + R * Math.sin(angle);

                itemDiv.style.transform = `translate(${dotX}px, ${dotY - 18}px)`;

                const distanceToFocus = Math.abs(angle);
                const maxProximityDist = 0.8;
                let factor = 1.0 - Math.min(distanceToFocus / maxProximityDist, 1.0);
                factor = Math.pow(factor, 2.0); 

                const dot = document.getElementById(`wheel-dot-${i}`);
                const dotOuter = document.getElementById(`wheel-dot-outer-${i}`);
                const text = document.getElementById(`wheel-text-${i}`);
                const subtext = document.getElementById(`wheel-subtext-${i}`);

                if (dot && text && subtext) {
                    const scale = 0.85 + factor * 0.45;    
                    const opacity = 0.22 + factor * 0.78;  
                    
                    text.style.transform = `scale(${scale})`;
                    text.style.transformOrigin = 'left center';
                    text.style.opacity = opacity;
                    
                    if (i === STATE.currentIndex) {
                        // 选中态：极具数智科幻感的高级纯白色高亮文字，辅以白金全息霓虹效果
                        text.style.color = '#FFFFFF'; 
                        text.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.95), 0 0 20px rgba(255, 215, 0, 0.45)';
                        text.style.fontWeight = '500';
                        
                        dot.style.transform = 'scale(1.5)';
                        dot.style.backgroundColor = '#FFD700';
                        if (dotOuter) {
                            dotOuter.style.transform = 'scale(2.0)';
                            dotOuter.style.borderColor = '#FFD700';
                            dotOuter.style.boxShadow = '0 0 8px rgba(255, 215, 0, 0.6)';
                        }
                        
                        subtext.style.opacity = '1';
                        subtext.style.color = 'rgba(255, 215, 0, 0.7)';
                    } else {
                        // 非选中态：典雅清爽半透明浅白
                        text.style.color = 'rgba(255, 255, 255, 0.5)';
                        text.style.textShadow = 'none';
                        text.style.fontWeight = '300';
                        
                        dot.style.transform = 'scale(1.0)';
                        dot.style.backgroundColor = 'rgba(255, 215, 0, 0.3)';
                        if (dotOuter) {
                            dotOuter.style.transform = 'scale(1.0)';
                            dotOuter.style.borderColor = 'rgba(255, 215, 0, 0.3)';
                            dotOuter.style.boxShadow = 'none';
                        }
                        
                        subtext.style.opacity = '0';
                    }
                    
                    if (Math.abs(angle) > 1.25) {
                        itemDiv.style.display = 'none';
                    } else {
                        itemDiv.style.display = 'flex';
                    }
                }
            });
        }

        async function switchModelTo(index) {
            if (STATE.isMorphing) return;
            STATE.currentIndex = index; updateFileListUI();
            STATE.targetWheelAngle = -index * beta;

            STATE.isSolidMode = false; STATE.solidMorphProgress = 0;
            STATE.isMorphing = true;
            await animateMorph(STATE.morphProgress, 0, 300);

            const text = await STATE.files[index].text();
            
            parseAndSampleOBJ(text, async (success) => {
                if (success) {
                    await animateMorph(0, 1, 1000);
                    STATE.isMorphing = false;
                    generateAICommentary(STATE.files[index].name);
                    const panel = document.getElementById('ai-panel');
                    panel.classList.remove('opacity-0', 'translate-x-12');
                } else { STATE.isMorphing = false; }
            });
        }

        // 动画过渡
        function animateMorph(from, to, duration) {
            return new Promise(resolve => {
                const start = performance.now();
                function update() {
                    const t = Math.min((performance.now() - start) / duration, 1);
                    STATE.morphProgress = from + (to - from) * (t < 0.5 ? 2*t*t : -1+(4-2*t)*t);
                    if (t < 1) requestAnimationFrame(update); else resolve();
                }
                update();
            });
        }

        // 生成AI解说词
        function generateAICommentary(filename) {
            const aiText = document.getElementById('ai-text');
            const aiTitle = document.getElementById('ai-title');
            const name = filename.replace(/\.[^/.]+$/, "");
            aiTitle.innerText = name;
            let content = `正在感应数字时空频率，解析【${name}】的历史信息。该瓦当承载着高句丽独特的审美与工艺，是研究古代边疆文明的重要数智档案。`;
            for(let key in KNOWLEDGE_BASE) {
                if(name.includes(key)) {
                    content = KNOWLEDGE_BASE[key];
                    break;
                }
            }
            aiText.innerHTML = content;
        }

        // --- 手势追踪 ---
        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        
        hands.onResults((results) => {
            const canvas = document.getElementById('hands-canvas');
            const ctx = canvas.getContext('2d');
            ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-green-500';
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#FFD700', lineWidth: 2});
                STATE.targetRotationY = -(landmarks[9].x - 0.5) * Math.PI * 2.5;
                const pitch = (landmarks[9].y - landmarks[0].y) / Math.hypot(landmarks[9].x-landmarks[0].x, landmarks[9].y-landmarks[0].y);
                STATE.targetRotationX = Math.max(0, Math.min((pitch + 0.4) * Math.PI * 1.2, Math.PI));
                
                // 各手指弯曲判定
                const indexFolded = Math.hypot(landmarks[8].x - landmarks[0].x, landmarks[8].y - landmarks[0].y) < Math.hypot(landmarks[6].x - landmarks[0].x, landmarks[6].y - landmarks[0].y);
                const middleFolded = Math.hypot(landmarks[12].x - landmarks[0].x, landmarks[12].y - landmarks[0].y) < Math.hypot(landmarks[10].x - landmarks[0].x, landmarks[10].y - landmarks[0].y);
                const ringFolded = Math.hypot(landmarks[16].x - landmarks[0].x, landmarks[16].y - landmarks[0].y) < Math.hypot(landmarks[14].x - landmarks[0].x, landmarks[14].y - landmarks[0].y);
                const pinkyFolded = Math.hypot(landmarks[20].x - landmarks[0].x, landmarks[20].y - landmarks[0].y) < Math.hypot(landmarks[18].x - landmarks[0].x, landmarks[18].y - landmarks[0].y);

                const foldedCount = (indexFolded ? 1 : 0) + (middleFolded ? 1 : 0) + (ringFolded ? 1 : 0) + (pinkyFolded ? 1 : 0);
                const isFist = foldedCount >= 3;

                const pinch = Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y);
                const isOK = pinch < 0.05 && !middleFolded && !ringFolded && !pinkyFolded;

                STATE.targetScale = Math.max(0.6, Math.min(pinch * 5.0, 2.5));
                const deltaTime = (performance.now() - STATE.lastFrameTime) / 1000;
                STATE.lastFrameTime = performance.now();

                if (isFist) {
                    if (!STATE.isCooldown && !STATE.isMorphing) {
                        STATE.actionProgress += deltaTime / 1.0; 
                        if (STATE.actionProgress >= 1) { 
                            STATE.actionProgress = 0; STATE.isSolidMode = !STATE.isSolidMode;
                            STATE.isCooldown = true; setTimeout(() => STATE.isCooldown = false, 800);
                        }
                    }
                } else if (isOK && STATE.files.length > 1) {
                    STATE.actionProgress += deltaTime / 1.5; 
                    if (STATE.actionProgress >= 1) { STATE.actionProgress = 0; switchModelTo((STATE.currentIndex + 1) % STATE.files.length); }
                } else { STATE.actionProgress = Math.max(0, STATE.actionProgress - deltaTime * 3); }
                document.getElementById('progress-ring').style.strokeDashoffset = 282.7 * (1 - Math.min(STATE.actionProgress, 1));
            } else { document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-red-500'; }
            ctx.restore();
        });

        document.getElementById('start-cam-overlay').addEventListener('click', () => {
            document.getElementById('start-cam-overlay').style.display = 'none';
            document.getElementById('hands-canvas').classList.remove('opacity-0');
            new Camera(document.getElementById('video-input'), { onFrame: async () => await hands.send({image: document.getElementById('video-input')}), width: 320, height: 180 }).start();
        });

        // --- 全局触控、3D 空间拖动与滚轮缩放体系 ---
        let isPointerDown = false;
        let pointerStart = { x: 0, y: 0 };
        let pointerLast = { x: 0, y: 0 };
        let activePointers = [];
        let initialPinchDist = 0;
        let initialTargetScale = 1.0;
        let longPressTimer = null;
        let lastPointerDownTime = 0;

        function getDistance(p1, p2) {
            return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
        }

        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.glass-panel') || e.target.closest('button') || e.target.closest('label') || e.target.closest('input') || e.target.closest('#wheel-selector-container')) return;
            
            // 拦截移动端多点触控与默认滚动行为，保障拖动 3D 模型旋转时的流畅度
            if (e.pointerType === 'touch') {
                e.preventDefault();
            }

            isPointerDown = true;
            activePointers.push(e);
            pointerStart = { x: e.clientX, y: e.clientY };
            pointerLast = { x: e.clientX, y: e.clientY };

            const now = performance.now();
            if (now - lastPointerDownTime < 300) {
                if (!STATE.isMorphing) {
                    STATE.isSolidMode = !STATE.isSolidMode;
                }
                if (longPressTimer) clearTimeout(longPressTimer);
            } else {
                if (longPressTimer) clearTimeout(longPressTimer);
                longPressTimer = setTimeout(() => {
                    if (STATE.files.length > 1 && !STATE.isMorphing) {
                        switchModelTo((STATE.currentIndex + 1) % STATE.files.length);
                    }
                }, 800);
            }
            lastPointerDownTime = now;

            if (activePointers.length === 2) {
                initialPinchDist = getDistance(activePointers[0], activePointers[1]);
                initialTargetScale = STATE.targetScale;
                if (longPressTimer) clearTimeout(longPressTimer);
            }
        });

        container.addEventListener('pointermove', (e) => {
            const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
            if (idx !== -1) activePointers[idx] = e;

            if (!isPointerDown) return;

            if (e.pointerType === 'touch') {
                e.preventDefault();
            }

            const distMoved = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
            if (distMoved > 10 && longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }

            if (activePointers.length === 1) {
                const dx = e.clientX - pointerLast.x;
                const dy = e.clientY - pointerLast.y;
                STATE.targetRotationY += dx * 0.008;
                STATE.targetRotationX = Math.max(-Math.PI, Math.min(STATE.targetRotationX + dy * 0.008, Math.PI));
                pointerLast = { x: e.clientX, y: e.clientY };
            } else if (activePointers.length === 2) {
                const dist = getDistance(activePointers[0], activePointers[1]);
                if (initialPinchDist > 0) {
                    const factor = dist / initialPinchDist;
                    STATE.targetScale = Math.max(0.6, Math.min(initialTargetScale * factor, 2.5));
                }
            }
        });

        const endPointer = (e) => {
            isPointerDown = false;
            activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
            if (activePointers.length < 2) {
                initialPinchDist = 0;
            }
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        };

        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.08;
            const delta = -Math.sign(e.deltaY);
            STATE.targetScale = Math.max(0.6, Math.min(STATE.targetScale + delta * zoomSpeed, 2.5));
        }, { passive: false });

        // --- 与 Unity 父页面的通信逻辑 ---
        window.addEventListener('message', function(event) {
            if (event.data === 'fromParent: i am ready') {
                console.log('手势网站已准备好与 Unity 父页面通信');
            }
        });

        document.getElementById('backToUnityBtn').addEventListener('click', function() {
            window.parent.postMessage('fromGesture: close me', '*');
        });

        // --- 触发预存加载 ---
        initPreloadModels();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() / 1000;
            shaderMaterial.uniforms.uTime.value = time;
            shaderMaterial.uniforms.uMorphProgress.value = STATE.morphProgress;
            STATE.solidMorphProgress = THREE.MathUtils.lerp(STATE.solidMorphProgress, STATE.isSolidMode ? 1 : 0, 0.04);
            shaderMaterial.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            if (solidMaterial.userData.shader) solidMaterial.userData.shader.uniforms.uSolidProgress.value = STATE.solidMorphProgress;
            
            STATE.currentRotationY = THREE.MathUtils.lerp(STATE.currentRotationY, STATE.targetRotationY, 0.22);
            STATE.currentRotationX = THREE.MathUtils.lerp(STATE.currentRotationX, STATE.targetRotationX, 0.22);
            STATE.currentScale = THREE.MathUtils.lerp(STATE.currentScale, STATE.targetScale, 0.1);
            
            shaderMaterial.uniforms.uScale.value = STATE.currentScale;

            mainGroup.rotation.set(STATE.currentRotationX, STATE.currentRotationY, 0);
            mainGroup.scale.setScalar(STATE.currentScale);
            mainGroup.position.y = Math.sin(time * 0.5) * 0.1;

            // 每帧渲染左侧转盘姿态
            updateWheel();

            composer.render();
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            setupWheelLayout();
        });
    </script>
</body>
</html>
